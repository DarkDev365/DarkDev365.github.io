<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            // Priority: Saved preference, then fallback to system
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
            // If savedTheme is 'system' or null, and system is not dark, 
            // it defaults to light implicitly.
        })();
    </script>
    <style>
        /* Eliminates the FART (Flash of InAccurate coloR Theme) */
        :root[data-theme="dark"] {
            background-color: #282A30;
        }

        :root[data-theme="dark"] .box {
            background-color: #1A1A1A;
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#19f5a7">
    <title>Welcome to DarkDev365</title>
    <meta name="robots" content="noarchive,max-snippet:-1,max-image-preview:standard,max-video-preview:-1">
    <meta name="description" content="Welcome to DarkDev365.">

    <!-- Open Graph Data -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="DarkDev365">
    <meta property="og:title" content="Welcome to DarkDev365">
    <meta property="og:description" content="Welcome to my corner of the web.">
    <meta property="og:image" content="https://darkdev365.github.io/assets/images/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="675">

    <!-- Twitter Data -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Welcome to DarkDev365">
    <meta name="twitter:description" content="Welcome to my corner of the web.">
    <meta name="twitter:image" content="https://darkdev365.github.io/assets/images/og.png">

    <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/profile-pic.png">

    <!-- Stylesheet -->

</head>

<body>

                        rel="noopener noreferrer">Start browsing</a>

                <div class="contact-support-grid">
                    <!-- Row 1: Contact -->
                    <h2 class="section-title">Reach out</h2>
                    <div class="action-list">
                        <div class="action-pill">

    <script src="./assets/scripts/main.js" defer></script>
    <script src="./assets/scripts/qr-modal.js" defer></script>
</body>

</html>
